apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: data
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  # Tailnet-only, same model as Portainer: no public Traefik route. CI
  # runners and K3s nodes reach it at <fleet-control-tailscale-ip>:30500.
