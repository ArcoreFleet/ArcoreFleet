apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  # ClusterIP (default): reachable in-cluster at postgres.data.svc.cluster.local:5432

---
# For apps that run outside K3s (e.g. plain Docker on the same host) but
# still need Postgres over the tailnet. Tailnet-only, same model as
# Portainer - no public Traefik route exists for this.
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: data
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
