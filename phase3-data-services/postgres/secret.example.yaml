# Copy to secret.yaml, fill in real values, and apply - never commit
# secret.yaml (it's gitignored via the *secret* pattern in .gitignore).
# Generate a strong password with: openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: data
type: Opaque
stringData:
  POSTGRES_USER: "replace-with-a-username"
  POSTGRES_PASSWORD: "replace-with-a-strong-password"
  POSTGRES_DB: "arcorefleet"
