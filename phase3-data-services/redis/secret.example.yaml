# Copy to secret.yaml, fill in a real value, and apply - never commit
# secret.yaml (gitignored via the *secret* pattern in .gitignore).
# Generate a strong password with: openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: data
type: Opaque
stringData:
  REDIS_PASSWORD: "replace-with-a-strong-password"
