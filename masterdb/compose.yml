name: masterdb

services:
  db:
    image: postgres:16
    # One logical apply worker per app plus initial table-copy workers.
    command: [postgres, -c, max_worker_processes=24, -c, max_logical_replication_workers=16]
    container_name: masterdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    # Tailnet-only: bound to fleet-worker's Tailscale IP, never 0.0.0.0.
    ports:
      - "${MASTERDB_BIND:-127.0.0.1}:${MASTERDB_PORT:-5432}:5432"
    volumes:
      - masterdb-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot masterdb -> Oracle ADB feed, run by `./masterdb sync`.
  sync:
    build: ./sync
    profiles: ["sync"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ORACLE_WALLET_PASSWORD: ${ORACLE_WALLET_PASSWORD:-}
    volumes:
      - ./apps:/apps:ro
      - ./oracle-wallet:/wallet:ro

volumes:
  masterdb-data:
