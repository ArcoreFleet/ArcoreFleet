name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t fleet-portal-smoke portal
      - run: docker build -t fleet-sync-smoke masterdb/sync
      - run: python3 tools/smoke-containers.py --portal-image fleet-portal-smoke --sync-image fleet-sync-smoke
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r portal/requirements.txt
      - run: python portal/manage.py test access website hubauthority --noinput
      - run: python -m unittest discover -s masterdb/sync -p 'test_*.py' -v
      - run: python -m unittest discover -s tools/tests -v
  sso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - run: python -m unittest discover -s sso/tests -v
