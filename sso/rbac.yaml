# One-time infrastructure setup. No workload or additional running process.
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-sso
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-sso-provisioner
  namespace: fleet-sso
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-sso-provisioner
  namespace: fleet-sso
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-sso-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-sso-bootstrap
  namespace: portainer
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [portainer-sso-bootstrap]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-sso-bootstrap
  namespace: portainer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-sso-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-sso-exec
  namespace: apps
rules:
  # Existing ci-deployer already has deployment/pod read permissions here.
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-sso-exec
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-sso-exec
