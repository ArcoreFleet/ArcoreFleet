# Tests, builds and deploys the Fleet MCP gateway (fleet-mcp/) with the Phase 5 pipeline.
# Also requires REGISTRY_USERNAME and REGISTRY_PASSWORD; see registry/AUTH.md.
# Repo secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET, KUBE_CONFIG_CI.

name: Fleet MCP - test, build and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fleet-mcp/**", "docs/examples/workflows/fleet-mcp.yml", "tools/configure-registry-auth.py"]
  pull_request:
    paths: ["fleet-mcp/**", "docs/examples/workflows/fleet-mcp.yml", "tools/configure-registry-auth.py"]

concurrency:
  group: fleet-mcp-deploy
  cancel-in-progress: false

env:
  IMAGE: 192.0.2.10:30500/fleet-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request' && vars.FLEET_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_CONFIG: /tmp/fleet-docker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Join tailnet
        uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          export REGISTRY="${IMAGE%/*}"
          python3 tools/configure-registry-auth.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host
          buildkitd-config: fleet-mcp/phase5-buildkitd.toml

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest --metadata-file "$RUNNER_TEMP/image-metadata.json" --push fleet-mcp

      - name: Select immutable deployment image
        run: |
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/image-metadata.json")
          echo "DEPLOY_IMAGE=$IMAGE@$digest" >> "$GITHUB_ENV"

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Deploy to K3s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_CI }}" | base64 -d > ~/.kube/config
          kubectl -n apps set image deployment/fleet-mcp fleet-mcp=$DEPLOY_IMAGE
          kubectl -n apps rollout status deployment/fleet-mcp --timeout=180s

      - name: Remove registry credentials
        if: always()
        run: rm -f -- "$DOCKER_CONFIG/config.json"
